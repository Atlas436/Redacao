<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'; worker-src 'self';">
<link rel="icon" type="image/svg+xml" href="assets/sprites/dragon.svg">
<link rel="apple-touch-icon" href="assets/sprites/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
<meta property="og:type" content="website">
<meta property="og:title" content="Pergaminho de Evolução | Redação Quest">
<meta property="og:description" content="Acompanhe seu histórico de treinos, XP e conquistas.">
<meta property="og:image" content="https://atlas436.github.io/Redacao/assets/sprites/og-image.png">
<meta property="og:url" content="https://atlas436.github.io/Redacao/progresso.html">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Pergaminho de Evolução | Redação Quest">
<meta name="twitter:description" content="Acompanhe seu histórico de treinos, XP e conquistas.">
<meta name="twitter:image" content="https://atlas436.github.io/Redacao/assets/sprites/og-image.png">
<meta name="description" content="Acompanhe seu histórico de treinos, XP e conquistas.">
<title>Pergaminho de Evolução | Redação Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-nav"></div>

<main class="container">
  <h1>📈 Pergaminho de Evolução</h1>

  <div class="dialog-box">
    <div class="avatar"><img src="assets/sprites/mago.svg" alt="Mago das Palavras" class="avatar-img"></div>
    <div class="fala">
      <span class="nome">MAGO DAS PALAVRAS</span>
      <p>Cada redação corrigida ou simulado concluído fica registrado aqui neste dispositivo (armazenamento local do navegador). Acompanhe sua evolução, nível e conquistas!</p>
    </div>
  </div>

  <div id="resumo-xp">
    <h2>⭐ Nível <span id="nivel-atual">1</span></h2>
    <div class="barra"><div class="barra-fill xp" id="barra-xp" style="width:0%;"></div></div>
    <p class="barra-label" id="label-xp"></p>
  </div>

  <h2>🏅 Conquistas</h2>
  <div class="flex-wrap" id="lista-badges"></div>

  <h2>📊 Palavras por sessão</h2>
  <canvas id="grafico-canvas" width="900" height="220" style="width:100%;max-width:900px;background:#0a0612;border:3px solid var(--roxo-med);"></canvas>

  <h2>🗂️ Histórico de sessões</h2>
  <div id="tabela-historico"></div>

  <button class="btn-pixel perigo mt-2" id="btn-limpar-historico">🗑️ Apagar histórico</button>
</main>

<div id="app-footer"></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/progresso.js"></script>
</body>
</html>
