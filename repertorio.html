<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%90%89%3C/text%3E%3C/svg%3E">
<title>Biblioteca do Dragão — Repertório | Redação Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-nav"></div>

<main class="container">
  <h1>📚 Biblioteca do Dragão</h1>

  <div class="dialog-box">
    <div class="avatar">🐉</div>
    <div class="fala">
      <span class="nome">DRAGÃO GUARDIÃO</span>
      <p>Aqui você encontra sociólogos, filósofos, dados, leis, história e obras de arte — tudo pronto para armar seu argumento. Busque por nome ou filtre por área e por tema.</p>
    </div>
  </div>

  <div class="form-row">
    <label for="busca">🔍 Buscar por nome ou conceito</label>
    <input type="search" id="busca" placeholder="ex: Bauman, vigilância, capital cultural...">
  </div>

  <h3>Filtrar por área</h3>
  <div class="flex-wrap" id="filtro-area"></div>

  <h3>Filtrar por tema</h3>
  <div class="flex-wrap" id="filtro-tema"></div>

  <p class="muted" id="contador" style="margin-top:1.5rem;"></p>
  <div id="lista-repertorio"></div>
</main>

<div id="app-footer"></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/repertorio.js"></script>
</body>
</html>
